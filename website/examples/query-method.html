<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The QUERY Method — front.js Example</title>
    <meta
      name="description"
      content="A live demo of the HTTP QUERY method (RFC 10008): a read with a request body, fetched by a front.js island and answered by a Service Worker."
    />
    <style>
      :root {
        --bg: #0f1117;
        --panel: #1a1d27;
        --panel-2: #22262f;
        --line: #2c3040;
        --text: #e6e8ee;
        --muted: #9aa0b0;
        --accent: #b9ff3c; /* neon lime */
        --accent-ink: #14210a;
        --ok: #34c759;
        --warn: #ff9f0a;
        --error: #ff453a;
      }
      * { box-sizing: border-box; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Ubuntu, sans-serif;
        max-width: 720px;
        margin: 0 auto;
        padding: 2rem 1.25rem 4rem;
        background: var(--bg);
        color: var(--text);
        line-height: 1.5;
      }
      h1 { font-size: 1.9rem; margin: 0 0 0.25rem; }
      .lede { color: var(--muted); margin: 0 0 1.5rem; }
      code {
        font-family: 'SF Mono', Monaco, 'Courier New', monospace;
        background: #000;
        color: var(--accent);
        padding: 0.1em 0.35em;
        border-radius: 4px;
        font-size: 0.9em;
      }
      pre {
        background: #000;
        color: var(--text);
        padding: 0.75rem;
        border-radius: 8px;
        overflow-x: auto;
        margin: 0.25rem 0 0;
        font-size: 0.85rem;
      }
      pre code { background: none; padding: 0; color: inherit; }
      a { color: var(--accent); }

      .demo {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 1.25rem;
        margin: 1.5rem 0;
      }
      .notice {
        background: #2a2410;
        border: 1px solid var(--warn);
        color: #ffd479;
        padding: 0.75rem;
        border-radius: 8px;
        margin-bottom: 1rem;
        font-size: 0.9rem;
      }
      .query-panel { display: grid; gap: 0.75rem; margin-bottom: 1rem; }
      .field span { display: block; font-size: 0.85rem; color: var(--muted); margin-bottom: 0.35rem; }
      .field input[type='search'] {
        width: 100%;
        padding: 0.7rem 0.9rem;
        font-size: 1rem;
        background: #0b0d13;
        border: 1px solid var(--line);
        border-radius: 8px;
        color: var(--text);
      }
      .field input:focus { outline: none; border-color: var(--accent); }
      .checkbox { display: flex; align-items: center; gap: 0.5rem; font-size: 0.9rem; color: var(--muted); }

      .results ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 0.5rem; }
      .results li {
        background: #0b0d13;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 0.6rem 0.75rem;
      }
      .tag {
        font-size: 0.72rem;
        color: var(--muted);
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 0.05rem 0.5rem;
        margin-left: 0.4rem;
      }
      .badge {
        font-size: 0.72rem;
        color: var(--accent-ink);
        background: var(--accent);
        border-radius: 999px;
        padding: 0.05rem 0.5rem;
        margin-left: 0.3rem;
        font-weight: 600;
      }
      .note { color: var(--muted); font-size: 0.85rem; margin-top: 0.25rem; }
      .muted { color: var(--muted); }
      .error { color: var(--error); }

      .inspector {
        margin-top: 1.25rem;
        border-top: 1px dashed var(--line);
        padding-top: 1rem;
      }
      .inspector-title { font-weight: 700; margin-bottom: 0.5rem; }
      .inspector dl { display: grid; grid-template-columns: max-content 1fr; gap: 0.35rem 1rem; margin: 0; }
      .inspector dt { color: var(--muted); font-size: 0.85rem; }
      .inspector dd { margin: 0; }
      .ok { color: var(--ok); margin-left: 0.5rem; font-size: 0.85rem; }
      .warn { color: var(--warn); margin-left: 0.5rem; font-size: 0.85rem; }
    </style>
  </head>
  <body>
    <h1>The QUERY Method, live</h1>
    <p class="lede">
      A <em>read with a request body</em>. The search term and filters below travel in
      the HTTP body — not the URL — using the <code>QUERY</code> method
      (<a href="https://datatracker.ietf.org/doc/rfc10008/">RFC&nbsp;10008</a>). A
      Service Worker answers it, so it's a real request over the wire with no backend.
    </p>

    <div class="demo">
      <!-- Island boundary. The endpoint is same-origin and inside the SW scope. -->
      <div
        data-island
        data-component="QueryDemo"
        data-props='{"endpoint": "./api/search"}'
      ></div>
    </div>

    <p class="muted">
      Read the companion guide:
      <a href="../docs/guides/query-method.md">The QUERY Method</a>.
    </p>

    <!-- Register the Service Worker that answers the QUERY request. -->
    <script>
      (function registerQueryWorker() {
        if (!('serviceWorker' in navigator)) return;
        navigator.serviceWorker
          .register('./query-sw.js', { scope: './' })
          .then(function () {
            return navigator.serviceWorker.ready;
          })
          .then(function () {
            // On first ever load the SW activates but isn't controlling yet;
            // one reload hands it control so our endpoint becomes answerable.
            if (!navigator.serviceWorker.controller) location.reload();
          })
          .catch(function (err) {
            console.error('[query-demo] Service Worker registration failed:', err);
          });
      })();
    </script>

    <!-- Load uhtml (peer dep) for the framework's templating. -->
    <script type="importmap">
      {
        "imports": {
          "uhtml": "https://esm.sh/uhtml@4.5.11"
        }
      }
    </script>

    <!-- Load the front.js island. -->
    <script type="module" src="./query-method.js"></script>
  </body>
</html>
